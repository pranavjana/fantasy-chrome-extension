<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fantasy Agent</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="shell">
      <div class="brand-banner">
        <div class="brand-lockup">
          <img src="../../tinyfishsoccer.png" alt="Tinyfish Soccer">
          <div>
            <div class="brand-title">TinyFish Fantasy World Cup Companion</div>
            <div class="brand-subtitle" id="tool-status">Ready</div>
          </div>
        </div>
        <div class="banner-actions">
          <button class="icon-button" id="clear-chat" title="Clear chat" type="button" aria-label="Clear chat">↺</button>
          <details class="settings settings-menu">
            <summary title="Settings" aria-label="Settings">⚙</summary>
            <form id="settings-form">
              <div class="settings-heading">
                <strong>Settings</strong>
                <span>Keys are stored locally in Chrome. Chat requests and relevant page context may be sent to Anthropic and Tinyfish to provide responses. Official FIFA fantasy player data is fetched from play.fifa.com and cached locally.</span>
              </div>
              <label class="settings-field">
                <span>Anthropic API key</span>
                <input id="anthropic-key" autocomplete="off" type="password">
              </label>
              <label class="settings-field">
                <span>Anthropic model</span>
                <input id="anthropic-model" autocomplete="off" type="text">
              </label>
              <label class="settings-field">
                <span class="settings-label-row tinyfish-key-row">
                  <span class="tinyfish-key-title">
                    <img src="../../tinyfishsoccer.png" alt="">
                    Tinyfish API key
                  </span>
                  <a href="https://agent.tinyfish.ai/api-keys" target="_blank" rel="noreferrer">Get API key</a>
                </span>
                <input id="tinyfish-key" autocomplete="off" type="password">
              </label>
              <div class="settings-actions">
                <button type="submit">Save settings</button>
                <button class="secondary-button" id="clear-keys" type="button">Clear keys</button>
              </div>
              <p id="settings-status"></p>
            </form>
          </details>
        </div>
      </div>

      <section class="messages" id="messages"></section>

      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <textarea id="chat-input" placeholder="What should we research?" rows="3"></textarea>
          <div class="composer-footer">
            <button class="send-button" id="send-button" type="submit" aria-label="Send">↑</button>
          </div>
        </form>
      </div>

    </main>
    <script src="./popup.js" type="module"></script>
  </body>
</html>
